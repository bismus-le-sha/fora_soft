name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Валидация .claude/settings.json
        run: node -e "require('./.claude/settings.json'); console.log('settings.json OK')"

      - name: Синтаксис pre-merge хука
        run: node --check .claude/hooks/pre-merge-gate.js

      - name: Нет маркеров конфликтов слияния
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)' -- . ':!.github/workflows/**'; then
            echo "::error::Найдены маркеры конфликтов слияния"
            exit 1
          fi

  # Заготовки на будущее — раскомментируй и наполни, когда определимся со стеком.
  # Каждую новую джобу добавляй в required status checks ruleset (см. README).
