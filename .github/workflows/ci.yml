name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Валидация .claude/settings.json
        run: node -e "require('./.claude/settings.json'); console.log('settings.json OK')"

      - name: Синтаксис pre-merge хука
        run: node --check .claude/hooks/pre-merge-gate.js

      - name: Нет маркеров конфликтов слияния
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)' -- . ':!.github/workflows/**'; then
            echo "::error::Найдены маркеры конфликтов слияния"
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run test

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Блокирующий гейт — только прод-дерево: high/critical в поставляемых
      # зависимостях блокируют мерж (SEC-20); package-lock.json зафиксирован (SEC-19).
      # Dev-тулинг (eslint и т.п.) в прод-бандл не попадает и оценивается отдельно ниже.
      - run: npm run audit
      # Информационный аудит dev-зависимостей — не блокирует мерж, для видимости.
      - name: audit (dev, non-blocking)
        continue-on-error: true
        run: npm run audit:dev
